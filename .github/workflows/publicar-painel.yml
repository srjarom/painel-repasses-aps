# Publica o painel no GitHub Pages.
# Roda sozinho a cada Push na branch main (e pode ser rodado à mão na aba Actions → "Run workflow").
# Publica SÓ o conteúdo da pasta site/. As pastas manutencao/, docs/, testes/ e marca/ não vão para o link.
name: Publicar painel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
